[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "sympy-poly-rust"
version = "0.1.0"
description = "Rust port of the sympy/sympy polys-domain kernel (dense arithmetic over QQ)"
authors = [{ name = "sympy-rust contributors" }]
maintainers = [{ name = "sympy-rust publishers" }]
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
keywords = ["sympy", "polynomial", "rust"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/John-Cusack/sympy-rust"
Upstream = "https://github.com/sympy/sympy"

[tool.maturin]
module-name = "sympy_poly._core"
bindings = "pyo3"
features = ["pyo3/extension-module"]
sdist-include = ["sympy-poly-core/**/*", "NOTICE"]
