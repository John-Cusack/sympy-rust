[workspace]
members = ["sympy-poly-core"]
resolver = "2"

[package]
name = "sympy-poly-rust"
version = "0.1.0"
edition = "2021"
description = "Rust port of the sympy/sympy polys-domain kernel (dense arithmetic over QQ) with Python bindings"
license = "MIT"
repository = "https://github.com/John-Cusack/sympy-rust"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
sympy-poly-core = { path = "sympy-poly-core", version = "0.1.0" }
pyo3 = { version = "0.23", features = ["macros"] }
num-bigint = "0.4"
